name: Importazione verificata del progetto
on:
  push:
    branches: [main]
    paths: ['_bootstrap/READY.json']
permissions:
  contents: write
concurrency:
  group: project-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verifica integrita e materializza i file
        shell: python
        run: |
          import base64, hashlib, io, json, pathlib, re, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '_bootstrap/READY.json').read_text())
          chunks = manifest['chunks']
          if not chunks or any(not re.fullmatch(r'part-\d{3}\.b64', c) for c in chunks):
              raise SystemExit('Invalid chunk list')
          raw = base64.b64decode(''.join((root / '_bootstrap' / c).read_text().strip() for c in chunks), validate=True)
          if hashlib.sha256(raw).hexdigest() != manifest['sha256']:
              raise SystemExit('Bundle checksum mismatch')
          seen = set()
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:xz') as archive:
              for entry in archive.getmembers():
                  path = pathlib.PurePosixPath(entry.name)
                  if (not entry.isfile() or path.is_absolute() or '..' in path.parts
                          or not path.parts or path.parts[0] in {'.git', '.github', '_bootstrap'}
                          or entry.name in seen or entry.size > 10000000):
                      raise SystemExit('Disallowed bundle entry: ' + entry.name)
                  data = archive.extractfile(entry).read()
                  if hashlib.sha256(data).hexdigest() != manifest['files'].get(entry.name):
                      raise SystemExit('File checksum mismatch: ' + entry.name)
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  seen.add(entry.name)
          if seen != set(manifest['files']):
              raise SystemExit('Incomplete bundle')
          print('Verified files:', len(seen))
      - run: python -m pip install -r requirements/dev.txt
      - run: python scripts/check_repository.py
      - run: python -m pytest -q
      - name: Pubblica sorgenti, relazione e figure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf _bootstrap
          git add --all -- ':!.github'
          git commit -m 'Pubblica relazione, runtime, figure e test verificati'
          git push origin HEAD:main
