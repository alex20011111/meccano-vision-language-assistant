name: Finalize English repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-english-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore the verified English source edition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, io, json, lzma, os, pathlib, shutil, tarfile, urllib.request

          repo = pathlib.Path.cwd()
          blob_sha = 'a2f426a0fcc5db1280d70573e50075c8cd23902c'
          expected_sha256 = '41f9b46796a55c4242330b95da4792e33195c1630b401395ba4202027881c6f9'
          url = f'https://api.github.com/repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{blob_sha}'
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(req, timeout=30) as response:
              item = json.load(response)
          packed = base64.b64decode(item['content'])
          git_sha = hashlib.sha1(b'blob ' + str(len(packed)).encode() + b'\0' + packed).hexdigest()
          if git_sha != blob_sha:
              raise SystemExit('Source archive Git-blob verification failed')
          if hashlib.sha256(packed).hexdigest() != expected_sha256:
              raise SystemExit('Source archive SHA-256 verification failed')

          raw = lzma.decompress(packed)
          source_dir = pathlib.Path(os.environ['RUNNER_TEMP']) / 'english-source'
          source_dir.mkdir(parents=True, exist_ok=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              for member in archive.getmembers():
                  if not member.isfile():
                      continue
                  rel = pathlib.PurePosixPath(member.name)
                  if rel.is_absolute() or '..' in rel.parts or '__pycache__' in rel.parts:
                      continue
                  extracted = archive.extractfile(member)
                  if extracted is None:
                      continue
                  target = source_dir.joinpath(*rel.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(extracted.read())

          expected = {
              'meccano_tracker.py', 'composition_controller.py', 'composition_ui.py',
              'assembly_guide_cad.py', 'part_orientation.py', 'voice_assistant.py',
              'voice_runtime.py', 'parts_catalog.py', 'generate_silhouettes.py',
              'orient_and_generate.py', 'rotate_silhouette.py', 'create_class_map.py',
              'generate_meccano_dataset.py', 'prepare_training.py', 'preview_colors.py',
              'requirements.txt', 'requirements_dev.txt', 'requirements_voice.txt',
          }
          missing = sorted(name for name in expected if not (source_dir / name).is_file())
          if missing:
              raise SystemExit('Missing English source files: ' + ', '.join(missing))

          for path in source_dir.rglob('*'):
              if not path.is_file() or '__pycache__' in path.parts:
                  continue
              rel = path.relative_to(source_dir)
              dst = repo / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, dst)

          obsolete = [
              'crea_mappa.py', 'genera_dataset_meccano.py', 'prepara_addestramento.py',
              'prova_colori.py', 'RELAZIONE_WEB.md', 'docs/ADDESTRAMENTO.md',
              'docs/SORGENTI.md', 'docs/UML_E_CODICE.md',
              'Meccano Guida.html', 'Meccano_Report_English.html',
              '.github/workflows/finalize-english-source.yml',
          ]
          for name in obsolete:
              (repo / name).unlink(missing_ok=True)

          bootstrap = repo / '_bootstrap'
          if bootstrap.exists():
              shutil.rmtree(bootstrap)

          old_workflows = [
              'english-edition.yml', 'finish-project-publication.yml', 'import-project.yml',
              'pubblica-sorgenti.yml', 'publish-navigable-report.yml',
              'publish-project-website.yml', 'import-report.yml', 'report-site.yml',
          ]
          for name in old_workflows:
              (repo / '.github' / 'workflows' / name).unlink(missing_ok=True)

          print('English sources restored:', len([p for p in source_dir.rglob('*') if p.is_file()]))

      - name: Install offline-test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless requests pytest pytest-subtests

      - name: Compile and run tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v

      - name: Audit user-facing text
        shell: python
        run: |
          import re
          from pathlib import Path

          forbidden = [
              r'\bAvvia composizione\b', r'\bVerifica pezzi\b', r'\bCambia composizione\b',
              r'\bDomanda vocale\b', r'\bStop voce\b', r'\bConcludi\b',
              r'\bPARTENZA\b', r'\bMONTAGGIO\b', r'\bPEZZI DELLA COMPOSIZIONE\b',
              r'\bDESTRO LIBERO\b', r'\bRIPORTARE I PEZZI\b', r'\bNessun\b',
              r'\bNessuna\b', r'\bATTENZIONE\b', r'\bERRORE\b',
              r'\bdescrizione\b', r'\bsinonimi\b', r'\bbuchi\b',
          ]
          patterns = [re.compile(x, re.I) for x in forbidden]
          errors = []
          extensions = {'.py', '.md', '.yml', '.yaml', '.txt', '.html'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.suffix.lower() not in extensions:
                  continue
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if path.suffix.lower() == '.html':
                  text = re.sub(r'data:image/[^;]+;base64,[A-Za-z0-9+/=\s]+', '', text)
              for pattern in patterns:
                  if pattern.search(text):
                      errors.append(f'{path}: {pattern.pattern}')
          if errors:
              raise SystemExit('Italian user-facing text remains:\n' + '\n'.join(errors))
          print('English text audit passed.')

      - name: Commit the English source edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete the English source and interface edition'
            git push origin HEAD:main
          fi
