name: Finalize English repository
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-english-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline dependencies
        run: python -m pip install beautifulsoup4 numpy opencv-python-headless requests
      - name: Restore and translate the verified source listings
        run: python tools/finalize_english.py
      - name: Use a portable source snapshot check
        shell: python
        run: |
          from pathlib import Path
          p = Path('tests/test_new_controls.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('ast.dump(node,include_attributes=False)', 'ast.get_source_segment(source,node)')
          s = s.replace('3aced9c03dca8cb48283959114d8410d203a2f0140bc35c347bb8d3e80fe26d7', '40f14c011eddc88af6d4a4dc06da86eab744af73eaa702a270ae211bcd7f42ee')
          p.write_text(s,encoding='utf-8')
      - name: Compile and test the English runtime
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Publish tested sources and remove the one-time migration
        run: |
          rm tools/finalize_english.py .github/workflows/finalize-english-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Complete English runtime, tests and interactive source documentation'
            git push origin HEAD:main
          fi
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)"
