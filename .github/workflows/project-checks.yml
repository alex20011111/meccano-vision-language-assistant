name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless requests beautifulsoup4
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate report structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import json
          page = Path('report/index.html')
          if not page.is_file():
              raise SystemExit('report/index.html is missing')
          soup = BeautifulSoup(page.read_text(encoding='utf-8'), 'html.parser')
          for element_id in ('uc-data', 'uc-diagrams'):
              node = soup.find(id=element_id)
              if node is None:
                  raise SystemExit(f'{element_id} is missing')
              json.loads(node.string)
          print('Report structure is valid.')
          PY
