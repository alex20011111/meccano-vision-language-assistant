name: Translate report figure labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/translate-figure-labels.yml'
      - 'tools/translate_report_labels.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: report-figure-localisation
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and HTML dependencies
        run: |
          python -m pip install pillow beautifulsoup4 numpy
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
      - name: Translate labels and verify protected image data
        run: python tools/translate_report_labels.py
      - name: Commit verified HTML and figure manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/index.html Meccano_Report_English.html docs/FIGURE_TRANSLATION.json
          if ! git diff --cached --quiet; then
            git commit -m 'Translate report chart labels and interface annotations into English'
            git push origin HEAD:main
          fi
