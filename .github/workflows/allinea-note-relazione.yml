name: Allineamento note della relazione
on:
  push:
    branches: [main]
    paths: ['.github/workflows/allinea-note-relazione.yml']
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/navigable-project-report
      - name: Uniforma le note
        shell: python
        run: |
          import pathlib, subprocess
          p = pathlib.Path('report/index.html')
          current = subprocess.check_output(['git', 'hash-object', str(p)], text=True).strip()
          if current != '567e15e17ded1a66aa7364e4d3cdb8359a891437':
              raise SystemExit('La pagina e cambiata; nessuna sovrascrittura.')
          s = p.read_text(encoding='utf-8')
          edits = {
              'Provenienza e integrità editoriale': 'Materiali di lavoro e limiti della valutazione',
              'La ricostruzione usa i sorgenti di riferimento, il progetto formativo, le correzioni del progetto e due export di appunti di sviluppo. Gli export sono fonti di contesto, non una bibliografia scientifica e non vengono redistribuiti integralmente.': 'Ho organizzato la relazione confrontando i sorgenti, gli appunti di lavoro e i risultati delle prove. Distinguo le decisioni applicate dalle alternative considerate. Per gli algoritmi e le librerie faccio riferimento alla documentazione tecnica indicata sopra.',
              'Le figure di addestramento sono conservate senza cambiare dati o etichette. Il CSV del run, la configurazione completa, i valori per classe, il checkpoint e il test reale indipendente servono per verifiche numeriche ulteriori. Le risorse non allegate non sono dichiarate incluse.': 'Conservo le figure di addestramento senza cambiare dati o etichette. Per verifiche numeriche ulteriori servono CSV del run, configurazione, valori per classe, checkpoint e test reale indipendente. Pesi, dataset e asset del banco rimangono risorse separate dalla documentazione.',
              'Contributo progettuale: integrazione dei sottosistemi, stabilizzazione e gestione dello stato, raccordo CAD–immagine, interazione e consolidamento dei requisiti. Le librerie e i modelli preesistenti rimangono attribuiti ai rispettivi autori; non viene attribuito al tirocinio lo sviluppo da zero di YOLO, ByteTrack o Whisper.': 'Il mio lavoro ha riguardato l’integrazione dei sottosistemi, la stabilizzazione e la gestione dello stato, il raccordo CAD–immagine e l’interazione con l’operatore. Ho utilizzato YOLO, ByteTrack, Whisper e le altre librerie come componenti preesistenti, mantenendone i riferimenti e le attribuzioni.',
              '<span class="tag warning">Screenshot richiesto</span><strong>Composizione attiva</strong><span>Frame completo con linea centrale, pezzi riconosciuti a sinistra, sagome a destra e pulsanti. Indicare la revisione del programma.</span>': '<span class="tag neutral">Nella copia HTML completa</span><strong>Composizione attiva</strong><span>La schermata mostra linea centrale, pezzi riconosciuti a sinistra, sagome a destra e pulsanti della composizione.</span>',
              '<span class="tag warning">Screenshot richiesto</span><strong>Verifica e feedback</strong><span>Alcuni pezzi completati e altri ancora necessari, con richiami soltanto a sinistra e tracking visibile su entrambi i lati.</span>': '<span class="tag neutral">Documentazione dei piazzamenti</span><strong>Verifica e feedback</strong><span>Distinguo nelle schermate sagome completate, pezzi ancora necessari e riquadri del tracking. L’immagine con TRIAL appartiene alla versione storica.</span>',
          }
          for old, new in edits.items():
              if old not in s:
                  raise SystemExit('Passaggio previsto non trovato: ' + old[:65])
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print('Passaggi rivisti:', len(edits))
      - name: Registra le note
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add report/index.html
          git diff --cached --check
          git commit -m 'docs: uniforma la narrazione e le note sulle immagini del progetto'
          git push origin HEAD:docs/navigable-project-report
